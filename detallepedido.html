<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detalle del pedido | Santo Grano</title>
    <link rel="stylesheet" href="css/detallepedido.css">
</head>
<body>
    <main>
    <h1> Detalle del pedido</h1>

    <section>
        <div class="encabezado-pedido">
            <div>
        <h2>Pedido #001</h2>
        <p>01/11/2026 - 10:00 - 3 unidades</p>
            </div>
            
             <p class="estado">Confirmado</p>

        </div>
        <table> 
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio unitario</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>

                </tr>

            </thead>
            <tbody>
                <tr>
                    <td> Cafe americano</td>
                    <td>Q12.00</td>
                    <td>2</td>
                    <td>Q24.00</td>

                </tr>
                <tr>
                    <td>Sandwich</td>
                    <td>Q22.00</td>
                    <td>1</td>
                    <td>Q22.00<td>

                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Total</th>
                    <td>Q46.00</td>

                </tr>
            </tfoot>
        </table>
    </section>
    <!-- esta seccion es para crear la tabla, tr agrupa, th es nombre de columna y td es para la celda -->
<!--colspan es para que ocupe cierta cantidad de columnas y se agrupa con el tfoot  -->
    </main>
</body>
</html>
