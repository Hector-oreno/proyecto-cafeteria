<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>detalle del pedido | Santo Grano</title>
        <link rel="stylesheet" href="css/detallepedido.css">
        <script src="js/funciones.js" defer></script>
        <script src="js/detallepedido.js" defer></script>
    </head>
    <body>
        <main>
            <h1> Detalle del pedido</h1>
            <p id="mensaje" role="status" aria-live="polite"></p>
            <section>
                <div class="encabezado-pedido">
                    <div>
                        <h2 id="numeroPedido">Detalle del pedido</h2>
                        <p id="datosPedido"></p>
                    </div>
                    <p class="estado" id="estado" hidden="hidden">Confirmado</p>
                </div>
                <div class="tabla_contenedor">
                    <table>
                        <caption>Productos del pedido</caption>
                        <thead>
                            <tr>
                                <th scope="col">Producto</th>
                                <th scope="col">Precio unitario</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="productosPedido"></tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" scope="row">Total</th>
                                <td id="totalPedido">Q0.00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <footer class="pie-detalle">
                    <a href="ventasdeldia.html" class="enlace_inicio">Volver a ventas</a>
                    <a href="index.html" class="enlace_inicio">INICIO</a>
                </footer>
            </section>
        </main>
    </body>
</html>
